<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<title>후방교회 기선 거리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --text: #1b2430;
  --muted: #5d6b7a;
  --line: #d9dfe5;
  --accent: #1f5f8b;
  --accent-text: #ffffff;
  --ok: #1e7a3c;
  --ok-bg: #e3f4e8;
  --warn: #8a5a00;
  --warn-bg: #fff3d6;
  --bad: #b3261e;
  --bad-bg: #fde7e5;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161c;
    --surface: #1b232c;
    --text: #e6ebf0;
    --muted: #97a4b2;
    --line: #2e3a46;
    --accent: #5aa7dc;
    --accent-text: #0b1218;
    --ok: #6fd08f;
    --ok-bg: #173323;
    --warn: #f0c060;
    --warn-bg: #3a2f12;
    --bad: #ff8a80;
    --bad-bg: #3d1d1b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 640px; margin: 0 auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }

header.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  margin: 0 -16px; padding: 10px 16px;
  background: var(--accent); color: var(--accent-text);
}
header.bar h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header.bar button { background: transparent; color: inherit; border: 0; min-height: 44px; min-width: 44px; font-size: 18px; }

nav.tabs { position: sticky; top: 64px; z-index: 4; display: flex; margin: 0 -16px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs button { flex: 1; min-height: 46px; border: 0; background: none; color: var(--muted); font-size: 15px; font-weight: 600; border-bottom: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.banner { margin: 12px 0; padding: 10px 12px; border-radius: var(--radius); background: var(--bad-bg); color: var(--bad); font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 12px 0; }
.card h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }

button, .btn {
  font: inherit; min-height: 44px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; }
.full { width: 100%; }

label.field { display: block; margin: 8px 0; }
label.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select {
  font: inherit; width: 100%; min-height: 44px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list button.item { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 0; border-radius: 0; background: none; padding: 10px 0; min-height: 56px; }
.item .name { font-weight: 650; min-width: 52px; }
.item .meta { flex: 1; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.hint { color: var(--muted); font-size: 13px; }
.err { color: var(--bad); font-size: 13px; }

.status { padding: 10px 12px; border-radius: var(--radius); font-weight: 600; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.status.fail { background: var(--bad-bg); color: var(--bad); }
.status ul { margin: 6px 0 0; padding-left: 18px; font-weight: 400; font-size: 14px; }

.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.big div { background: var(--bg); border-radius: 8px; padding: 10px 4px; }
.big b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.big div:first-child b { font-size: 26px; color: var(--accent); }
.big small { color: var(--muted); font-size: 12px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; border-top: 0; }
th:first-child, td:first-child { text-align: left; }
tr.over td { color: var(--bad); font-weight: 600; }
tr.off td { color: var(--muted); text-decoration: line-through; }
td input[type=checkbox] { width: 22px; min-height: 22px; height: 22px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 14px 14px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 8px; font-size: 18px; }
.preview { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); font-size: 13px; font-variant-numeric: tabular-nums; }
textarea.copy { width: 100%; min-height: 160px; font: 13px ui-monospace, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---- calc.js ----
// 후방교회 기선 거리 — 순수 계산 (DOM 없음)

const DEG = Math.PI / 180;
const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)$/;

function normName(s) {
  return String(s ?? '').trim().toUpperCase();
}

function parseNum(str, { optional = false } = {}) {
  const s = String(str ?? '').trim().replace(',', '.');
  if (s === '') return optional ? { ok: true, v: 0 } : { ok: false, error: '값 없음' };
  if (!NUM_RE.test(s)) return { ok: false, error: `숫자 아님: ${str}` };
  return { ok: true, v: Number(s) };
}

function parseDms(s) {
  let sign = 1;
  if (s.startsWith('-')) { sign = -1; s = s.slice(1).trim(); }
  else if (s.startsWith('+')) s = s.slice(1).trim();
  let d, m, sec;
  const parts = s.split(/[\s-]+/).filter(Boolean);
  if (parts.length > 1) {
    if (parts.length > 3 || !parts.every(p => NUM_RE.test(p))) return null;
    [d, m = 0, sec = 0] = parts.map(Number);
  } else {
    if (!/^(\d+)(\.(\d*))?$/.test(s)) return null;
    const [ip, fp = ''] = s.split('.');
    const f = fp.padEnd(4, '0');
    d = Number(ip);
    m = Number(f.slice(0, 2));
    sec = Number(f.slice(2, 4) + '.' + (f.slice(4) || '0'));
  }
  if (m >= 60 || sec >= 60) return { error: '분·초는 60 미만이어야 함' };
  return { deg: sign * (d + m / 60 + sec / 3600) };
}

function parseAngle(str, unit) {
  const s = String(str ?? '').trim().replace(',', '.');
  if (s === '') return { ok: false, error: '각도 없음' };
  if (unit === 'dms') {
    const r = parseDms(s);
    if (!r) return { ok: false, error: `각도 형식 오류: ${str}` };
    if (r.error) return { ok: false, error: r.error };
    return { ok: true, rad: r.deg * DEG };
  }
  if (!NUM_RE.test(s)) return { ok: false, error: `각도 형식 오류: ${str}` };
  const v = Number(s);
  return { ok: true, rad: unit === 'gon' ? v * Math.PI / 200 : v * DEG };
}

function num(str, label, optional = false) {
  const r = parseNum(str, { optional });
  if (!r.ok) throw new Error(`${label}: ${r.error}`);
  return r.v;
}

function ang(str, unit, label) {
  const r = parseAngle(str, unit);
  if (!r.ok) throw new Error(`${label}: ${r.error}`);
  return r.rad;
}

// 기계점 지면 표지 원점, x=E(수평각 90°), y=N(수평각 0°), z=위
function localPoint(obs, station, settings) {
  try {
    if (obs.mode === 'coord') {
      return {
        ok: true,
        x: num(obs.e, 'E') - num(station.e0, 'E0', true),
        y: num(obs.n, 'N') - num(station.n0, 'N0', true),
        z: num(obs.z, 'Z') - num(station.z0, 'Z0', true),
      };
    }
    const sd = num(obs.sd, '사거리');
    let ha = ang(obs.ha, settings.angleUnit, '수평각');
    let za = ang(obs.va, settings.angleUnit, '연직각');
    if (settings.vAngle === 'elevation') za = Math.PI / 2 - za;
    if (za > Math.PI) { za = 2 * Math.PI - za; ha += Math.PI; }
    const hd = sd * Math.sin(za);
    return {
      ok: true,
      x: hd * Math.sin(ha),
      y: hd * Math.cos(ha),
      z: sd * Math.cos(za) + num(station.hi, '기계고', true) - num(obs.ht, '프리즘고', true),
    };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// b ≈ R(theta)·a + t 최소제곱 (축척 1)
function fitRigid2D(pairs) {
  const n = pairs.length;
  let ax = 0, ay = 0, bx = 0, by = 0;
  for (const { a, b } of pairs) { ax += a.x; ay += a.y; bx += b.x; by += b.y; }
  ax /= n; ay /= n; bx /= n; by /= n;
  let sn = 0, cs = 0;
  for (const { a, b } of pairs) {
    const px = a.x - ax, py = a.y - ay, qx = b.x - bx, qy = b.y - by;
    sn += px * qy - py * qx;
    cs += px * qx + py * qy;
  }
  const theta = Math.atan2(sn, cs);
  const c = Math.cos(theta), s = Math.sin(theta);
  return { theta, tx: bx - (c * ax - s * ay), ty: by - (s * ax + c * ay) };
}

const NARROW_SPAN = 0.5;

function stationPoints(station, settings) {
  const list = station.obs.map(o => {
    const p = localPoint(o, station, settings);
    return { id: o.id, name: o.name, key: normName(o.name), ok: p.ok, error: p.ok ? null : p.error, dup: false, p };
  });
  const map = new Map();
  for (const it of list) {
    if (!it.ok || !it.key) continue;
    if (map.has(it.key)) map.get(it.key).dup = true;
    map.set(it.key, it);
  }
  return { list, map };
}

function solve(job) {
  const settings = job.settings;
  const tolH = Number(settings.tolH), tolV = Number(settings.tolV);
  const s1 = stationPoints(job.stations.S1, settings);
  const s2 = stationPoints(job.stations.S2, settings);
  const perStation = {
    S1: s1.list.map(({ id, name, ok, error, dup }) => ({ id, name, ok, error, dup })),
    S2: s2.list.map(({ id, name, ok, error, dup }) => ({ id, name, ok, error, dup })),
  };
  const excluded = new Set((job.excluded || []).map(normName));
  const commonKeys = [...s1.map.keys()].filter(k => s2.map.has(k));
  const activeKeys = commonKeys.filter(k => !excluded.has(k));
  const messages = [];

  if (activeKeys.length < 2) {
    messages.push({ level: 'error', code: 'NOT_ENOUGH_COMMON',
      text: '계산 불가 — S1과 S2에서 같은 이름으로 2점 이상 관측 필요' });
    return {
      status: 'fail', messages, baseline: null,
      common: commonKeys.map(k => ({ name: s1.map.get(k).name.trim(), excluded: excluded.has(k), rh: null, rv: null, over: false })),
      rmsH: null, rmsV: null, worst: null, points: [], perStation,
    };
  }

  const fit = fitRigid2D(activeKeys.map(k => ({ a: s2.map.get(k).p, b: s1.map.get(k).p })));
  const tz = activeKeys.reduce((s, k) => s + s1.map.get(k).p.z - s2.map.get(k).p.z, 0) / activeKeys.length;
  const c = Math.cos(fit.theta), sn = Math.sin(fit.theta);
  const toS1 = (p) => ({ x: c * p.x - sn * p.y + fit.tx, y: sn * p.x + c * p.y + fit.ty, z: p.z + tz });

  const common = commonKeys.map(k => {
    const name = s1.map.get(k).name.trim();
    if (excluded.has(k)) return { name, excluded: true, rh: null, rv: null, over: false };
    const a = s1.map.get(k).p, b = toS1(s2.map.get(k).p);
    const rh = Math.hypot(a.x - b.x, a.y - b.y), rv = a.z - b.z;
    return { name, excluded: false, rh, rv, over: rh > tolH || Math.abs(rv) > tolV };
  });
  const active = common.filter(r => !r.excluded);
  const rmsH = Math.sqrt(active.reduce((s, r) => s + r.rh ** 2, 0) / active.length);
  const rmsV = Math.sqrt(active.reduce((s, r) => s + r.rv ** 2, 0) / active.length);
  const overs = active.filter(r => r.over);
  const worst = overs.length ? overs.reduce((m, r) => (r.rh > m.rh ? r : m)).name : null;

  if (activeKeys.length === 2)
    messages.push({ level: 'warn', code: 'TWO_COMMON', text: '검증 불가 — 공통점 3점 이상 권장' });
  let span = 0;
  for (let i = 0; i < activeKeys.length; i++)
    for (let j = i + 1; j < activeKeys.length; j++) {
      const p = s1.map.get(activeKeys[i]).p, q = s1.map.get(activeKeys[j]).p;
      span = Math.max(span, Math.hypot(p.x - q.x, p.y - q.y));
    }
  if (span < NARROW_SPAN)
    messages.push({ level: 'warn', code: 'NARROW', text: '공통점 배치가 좁아 방향 오차가 큼' });
  if (overs.length)
    messages.push({ level: 'warn', code: 'OVER_TOL', text: `허용 잔차 초과 ${overs.length}점 — 최대: ${worst}` });

  const hd = Math.hypot(fit.tx, fit.ty);
  const baseline = { hd, dz: tz, sd: Math.hypot(hd, tz) };

  // 상대 좌표 (S1 로컬 → 축 회전)
  const raw = [
    { name: 'S1', x: 0, y: 0, z: 0, source: 'S1' },
    { name: 'S2', x: fit.tx, y: fit.ty, z: tz, source: 'S2' },
  ];
  const keys = [...new Set([...s1.map.keys(), ...s2.map.keys()])];
  for (const k of keys) {
    const a = s1.map.get(k), b = s2.map.get(k);
    const ests = [];
    if (a) ests.push(a.p);
    if (b) ests.push(toS1(b.p));
    raw.push({
      name: (a || b).name.trim(),
      x: ests.reduce((s, p) => s + p.x, 0) / ests.length,
      y: ests.reduce((s, p) => s + p.y, 0) / ests.length,
      z: ests.reduce((s, p) => s + p.z, 0) / ests.length,
      source: a && b ? 'both' : a ? 'S1' : 'S2',
    });
  }
  const phi = settings.axis === 'baseline' && hd > 0 ? Math.atan2(fit.ty, fit.tx) : 0;
  const pc = Math.cos(phi), ps = Math.sin(phi);
  const points = raw.map(p => ({
    name: p.name, source: p.source, Z: p.z,
    X: p.x * pc + p.y * ps,
    Y: -p.x * ps + p.y * pc,
  }));

  return {
    status: messages.length ? 'warn' : 'ok',
    messages, baseline, common, rmsH, rmsV, worst, points, perStation,
  };
}

// ---- store.js ----
// 저장·백업·CSV

const STORAGE_KEY = 'rb.jobs.v1';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function newJob(name) {
  const now = Date.now();
  const station = () => ({ hi: '', n0: '', e0: '', z0: '', obs: [] });
  return {
    id: uid(), name, createdAt: now, updatedAt: now,
    settings: { angleUnit: 'dms', vAngle: 'zenith', tolH: 0.005, tolV: 0.005, axis: 'baseline' },
    stations: { S1: station(), S2: station() },
    excluded: [],
  };
}

function newObs(mode) {
  return { id: uid(), name: '', mode, sd: '', ha: '', va: '', ht: '', n: '', e: '', z: '' };
}

function loadJobs(storage) {
  try {
    const text = storage.getItem(STORAGE_KEY);
    if (text == null) return { ok: true, jobs: [] };
    const data = JSON.parse(text);
    return Array.isArray(data.jobs) ? { ok: true, jobs: data.jobs } : { ok: false, jobs: [] };
  } catch {
    return { ok: false, jobs: [] };
  }
}

function saveJobs(storage, jobs) {
  try {
    storage.setItem(STORAGE_KEY, exportBackup(jobs));
    return true;
  } catch {
    return false;
  }
}

function exportBackup(jobs) {
  return JSON.stringify({ version: 1, jobs });
}

function importBackup(text) {
  try {
    const data = JSON.parse(text);
    if (!data || data.version !== 1 || !Array.isArray(data.jobs)) return { ok: false, error: '백업 파일 형식이 아님' };
    return { ok: true, jobs: data.jobs };
  } catch {
    return { ok: false, error: '백업 파일을 읽을 수 없음' };
  }
}

const cell = (v) => {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
const fmtFixed = (v, d) => { const s = v.toFixed(d); return /^-0\.0*$/.test(s) ? s.slice(1) : s; };
const m4 = (v) => (v == null ? '' : fmtFixed(v, 4));
const mm1 = (v) => (v == null ? '' : fmtFixed(v * 1000, 1));

function resultCsv(job, result) {
  const rows = [[job.name], []];
  rows.push(['기선'], ['수평거리(m)', '사거리(m)', '고저차(m)']);
  if (result.baseline) {
    const b = result.baseline;
    rows.push([m4(b.hd), m4(b.sd), m4(b.dz)]);
  } else {
    rows.push(['계산 불가']);
  }
  for (const m of result.messages) rows.push([m.text]);
  rows.push([], ['공통점 잔차'], ['점명', '제외', '수평(mm)', '수직(mm)']);
  for (const c of result.common) rows.push([c.name, c.excluded ? 'Y' : '', mm1(c.rh), mm1(c.rv)]);
  if (result.rmsH != null) rows.push(['RMS', '', mm1(result.rmsH), mm1(result.rmsV)]);
  rows.push([], ['상대 좌표'], ['점명', 'X(m)', 'Y(m)', 'Z(m)', '출처']);
  for (const p of result.points) rows.push([p.name, m4(p.X), m4(p.Y), m4(p.Z), p.source]);
  return '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

// ---- app.js ----
// 화면 — 계산은 calc.solve 결과만 사용

const safeStorage = {
  getItem(k) { return window.localStorage.getItem(k); },
  setItem(k, v) { window.localStorage.setItem(k, v); },
};

const loaded = loadJobs(safeStorage);
const state = {
  jobs: loaded.jobs,
  storageOk: loaded.ok,
  currentId: null,
  tab: 'S1',
  sheet: null, // {type:'obs', station, draft, isNew} | {type:'copy', text}
};

const root = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f3 = (v) => (v == null ? '—' : fmtFixed(v, 3));
const mmf = (v) => (v == null ? '—' : fmtFixed(v * 1000, 1));
const currentJob = () => state.jobs.find(j => j.id === state.currentId) || null;
const otherStation = (k) => (k === 'S1' ? 'S2' : 'S1');

function persist() {
  const job = currentJob();
  if (job) job.updatedAt = Date.now();
  const ok = saveJobs(safeStorage, state.jobs);
  if (ok !== state.storageOk) { state.storageOk = ok; renderBanner(); }
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const today = () => new Date().toISOString().slice(0, 10);
const angleHint = (unit) => ({ dms: 'ddd.mmss', deg: '도', gon: 'gon' }[unit]);

// ---------- 렌더 ----------

function render() {
  const job = currentJob();
  root.innerHTML = job ? jobView(job) : listView();
  renderBanner();
  renderSheet();
}

function renderBanner() {
  let el = document.getElementById('banner');
  if (!el) return;
  el.innerHTML = state.storageOk ? '' : '<div class="banner">저장 안 됨 — 이 브라우저에 저장할 수 없습니다. 작업 목록에서 백업을 내려받으세요.</div>';
}

function listView() {
  const items = state.jobs.slice().sort((a, b) => b.updatedAt - a.updatedAt).map(j => {
    const r = solve(j);
    const meta = r.baseline ? `기선 ${f3(r.baseline.hd)} m` : `S1 ${j.stations.S1.obs.length}점 · S2 ${j.stations.S2.obs.length}점`;
    return `<li><div class="row">
      <button class="item grow" data-act="open" data-id="${j.id}"><span class="name">${esc(j.name)}</span><span class="meta">${meta}<br>${new Date(j.updatedAt).toLocaleString('ko-KR')}</span></button>
      <button data-act="rename" data-id="${j.id}" aria-label="이름 변경">✎</button>
      <button class="danger" data-act="delete" data-id="${j.id}" aria-label="삭제">🗑</button>
    </div></li>`;
  }).join('');
  return `
    <header class="bar"><h1>후방교회 기선 거리</h1></header>
    <div id="banner"></div>
    <div class="card">
      <button class="primary full" data-act="new">+ 새 작업</button>
    </div>
    <div class="card">
      <h2>작업 목록</h2>
      ${items ? `<ul class="list">${items}</ul>` : '<p class="hint">아직 작업이 없습니다. 새 작업을 만들고 S1 → S2 순서로 공통점 관측값을 입력하세요.</p>'}
    </div>
    <div class="card">
      <h2>백업</h2>
      <div class="row">
        <button class="grow" data-act="backup">백업 저장</button>
        <label class="btn grow" style="display:flex;align-items:center;justify-content:center">백업 불러오기
          <input type="file" accept=".json,application/json" data-act="restore" hidden></label>
      </div>
      <p class="hint">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우기 전에 백업하세요.</p>
    </div>`;
}

function jobView(job) {
  const tabs = [['S1', 'S1'], ['S2', 'S2'], ['result', '결과'], ['settings', '설정']]
    .map(([k, l]) => `<button role="tab" aria-selected="${state.tab === k}" data-act="tab" data-tab="${k}">${l}</button>`).join('');
  let body;
  if (state.tab === 'S1' || state.tab === 'S2') body = stationView(job, state.tab);
  else if (state.tab === 'result') body = resultView(job);
  else body = settingsView(job);
  return `
    <header class="bar"><button data-act="home" aria-label="작업 목록">←</button><h1>${esc(job.name)}</h1></header>
    <nav class="tabs" role="tablist">${tabs}</nav>
    <div id="banner"></div>
    ${body}`;
}

function obsSummary(o, settings) {
  if (o.mode === 'coord') return `N ${esc(o.n) || '?'} · E ${esc(o.e) || '?'} · Z ${esc(o.z) || '?'}`;
  return `SD ${esc(o.sd) || '?'} · HA ${esc(o.ha) || '?'} · ${settings.vAngle === 'zenith' ? 'ZA' : 'VA'} ${esc(o.va) || '?'}${o.ht ? ` · HT ${esc(o.ht)}` : ''}`;
}

function stationView(job, key) {
  const st = job.stations[key];
  const r = solve(job);
  const status = new Map(r.perStation[key].map(p => [p.id, p]));
  const otherKeys = new Set(job.stations[otherStation(key)].obs.map(o => normName(o.name)).filter(Boolean));
  const rows = st.obs.map(o => {
    const s = status.get(o.id);
    let tag;
    if (!s.ok) tag = `<span class="tag bad">오류</span>`;
    else if (s.dup) tag = `<span class="tag warn">중복</span>`;
    else if (otherKeys.has(normName(o.name))) tag = `<span class="tag ok">공통</span>`;
    else tag = `<span class="tag">${key}만</span>`;
    return `<li><button class="item" data-act="edit" data-st="${key}" data-id="${o.id}">
      <span class="name">${esc(o.name) || '(이름 없음)'}</span>
      <span class="meta">${obsSummary(o, job.settings)}${s.ok ? '' : `<br><span class="err">${esc(s.error)}</span>`}</span>${tag}</button></li>`;
  }).join('');
  const nCommon = r.common.length;
  return `
    <div class="card">
      <h2>기계점 ${key}</h2>
      <label class="field"><span>기계고 HI (m) — 관측값 입력에 사용, 비우면 0</span>
        <input inputmode="decimal" data-bind="hi" data-st="${key}" value="${esc(st.hi)}"></label>
      <details ${st.n0 || st.e0 || st.z0 ? 'open' : ''}>
        <summary class="hint">기계점 좌표 (좌표 입력 시, 측량기에 설정한 값)</summary>
        <div class="grid3">
          <label class="field"><span>N0</span><input inputmode="decimal" data-bind="n0" data-st="${key}" value="${esc(st.n0)}"></label>
          <label class="field"><span>E0</span><input inputmode="decimal" data-bind="e0" data-st="${key}" value="${esc(st.e0)}"></label>
          <label class="field"><span>Z0</span><input inputmode="decimal" data-bind="z0" data-st="${key}" value="${esc(st.z0)}"></label>
        </div>
      </details>
    </div>
    <div class="card">
      <h2>관측점 ${st.obs.length}개 · 공통점 ${nCommon}개</h2>
      ${rows ? `<ul class="list">${rows}</ul>` : `<p class="hint">${key === 'S1' ? 'S1에서 보이는 공통점(타겟)을 관측해 입력하세요. S2에서도 같은 이름으로 관측해야 합니다.' : 'S1에서 관측한 공통점을 같은 이름으로 관측해 입력하세요. 3점 이상 권장.'}</p>`}
      <div class="row" style="margin-top:8px">
        <button class="primary grow" data-act="add" data-st="${key}" data-mode="polar">+ 관측값</button>
        <button class="grow" data-act="add" data-st="${key}" data-mode="coord">+ 좌표</button>
      </div>
    </div>`;
}

function resultView(job) {
  const r = solve(job);
  const cls = { ok: 'ok', warn: 'warn', fail: 'fail' }[r.status];
  const label = { ok: '정상', warn: '경고', fail: '계산 불가' }[r.status];
  const msgs = r.messages.length ? `<ul>${r.messages.map(m => `<li>${esc(m.text)}</li>`).join('')}</ul>` : '';
  let html = `<div class="status ${cls}">${label}${msgs}</div>`;
  if (r.status === 'fail') {
    const names = (k) => job.stations[k].obs.map(o => esc(o.name.trim())).filter(Boolean).join(', ') || '없음';
    return html + `<div class="card"><h2>점명 확인</h2><p>S1: ${names('S1')}</p><p>S2: ${names('S2')}</p>
      <p class="hint">두 기계점에서 같은 이름으로 관측한 점이 공통점이 됩니다(대소문자·공백 무시).</p></div>`;
  }
  const b = r.baseline;
  html += `<div class="card"><h2>S1 – S2</h2><div class="big">
    <div><b>${f3(b.hd)}</b><small>수평거리 m</small></div>
    <div><b>${f3(b.sd)}</b><small>사거리 m</small></div>
    <div><b>${f3(b.dz)}</b><small>고저차 m</small></div></div></div>`;
  const active = r.common.filter(c => !c.excluded).length;
  const rows = r.common.map(c => {
    const lock = !c.excluded && active <= 2;
    return `<tr class="${c.excluded ? 'off' : c.over ? 'over' : ''}">
      <td><label><input type="checkbox" data-act="toggle" data-name="${esc(c.name)}" ${c.excluded ? '' : 'checked'} ${lock ? 'disabled' : ''}> ${esc(c.name)}</label></td>
      <td>${mmf(c.rh)}</td><td>${mmf(c.rv)}</td></tr>`;
  }).join('');
  html += `<div class="card"><h2>공통점 잔차 (mm) · 허용 수평 ${mmf(job.settings.tolH)} / 수직 ${mmf(job.settings.tolV)}</h2>
    <div class="tablewrap"><table><thead><tr><th>사용 · 점명</th><th>수평</th><th>수직</th></tr></thead><tbody>${rows}
    <tr><td><b>RMS</b></td><td><b>${mmf(r.rmsH)}</b></td><td><b>${mmf(r.rmsV)}</b></td></tr></tbody></table></div>
    ${r.worst && active > 2 ? `<button class="full" style="margin-top:8px" data-act="toggle" data-name="${esc(r.worst)}">${esc(r.worst)} 제외 후 재계산</button>` : ''}
    <p class="hint">체크를 해제하면 그 점을 빼고 다시 계산합니다.</p></div>`;
  const pts = r.points.map(p => `<tr><td>${esc(p.name)}</td><td>${f3(p.X)}</td><td>${f3(p.Y)}</td><td>${f3(p.Z)}</td><td>${{ both: '양쪽', S1: 'S1', S2: 'S2' }[p.source]}</td></tr>`).join('');
  const axis = job.settings.axis === 'baseline' ? 'S1 원점, S1→S2 = +X' : 'S1 원점, S1 수평각 0° = +Y';
  html += `<div class="card"><h2>상대 좌표 (m) · ${axis}</h2>
    <div class="tablewrap"><table><thead><tr><th>점명</th><th>X</th><th>Y</th><th>Z</th><th>관측</th></tr></thead><tbody>${pts}</tbody></table></div></div>
    <div class="row"><button class="grow" data-act="csv">CSV 저장</button><button class="grow" data-act="copy">결과 복사</button></div>`;
  return html;
}

function settingsView(job) {
  const s = job.settings;
  const opt = (v, cur, l) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`;
  return `<div class="card">
    <label class="field"><span>각도 단위</span><select data-set="angleUnit">
      ${opt('dms', s.angleUnit, '도분초 (ddd.mmss)')}${opt('deg', s.angleUnit, '십진 도')}${opt('gon', s.angleUnit, 'gon')}</select></label>
    <label class="field"><span>연직각 종류</span><select data-set="vAngle">
      ${opt('zenith', s.vAngle, '천정각 (수평 = 90°)')}${opt('elevation', s.vAngle, '고도각 (수평 = 0°)')}</select></label>
    <div class="grid2">
      <label class="field"><span>허용 잔차 수평 (mm)</span><input inputmode="decimal" data-set="tolH" value="${esc(+(s.tolH * 1000).toFixed(3))}"></label>
      <label class="field"><span>허용 잔차 수직 (mm)</span><input inputmode="decimal" data-set="tolV" value="${esc(+(s.tolV * 1000).toFixed(3))}"></label>
    </div>
    <label class="field"><span>상대 좌표 축</span><select data-set="axis">
      ${opt('baseline', s.axis, 'S1 원점, S1→S2 방향 = +X')}${opt('s1', s.axis, 'S1 원점, S1 수평각 0° = +Y')}</select></label>
    <p class="hint">입력한 값은 그대로 보관되므로 단위를 바꾸면 기존 입력도 새 단위로 다시 해석됩니다.</p>
  </div>`;
}

// ---------- 입력 시트 ----------

function renderSheet() {
  let el = document.getElementById('sheet');
  if (!state.sheet) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; document.body.appendChild(el); }
  const sh = state.sheet;
  if (sh.type === 'copy') {
    el.innerHTML = `<div class="sheet-bg" data-act="close-bg"><div class="sheet"><h2>결과 텍스트</h2>
      <textarea class="copy" readonly>${esc(sh.text)}</textarea>
      <p class="hint">자동 복사가 안 되면 길게 눌러 선택·복사하세요.</p>
      <button class="full" data-act="close">닫기</button></div></div>`;
    return;
  }
  const job = currentJob();
  const d = sh.draft;
  const unit = angleHint(job.settings.angleUnit);
  const vl = job.settings.vAngle === 'zenith' ? '천정각 ZA' : '고도각 VA';
  const names = [...new Set(job.stations[otherStation(sh.station)].obs.map(o => o.name.trim()).filter(Boolean))];
  const fields = d.mode === 'coord'
    ? `<div class="grid3">
        ${inp('n', 'N', d.n)}${inp('e', 'E', d.e)}${inp('z', 'Z', d.z)}</div>`
    : `<div class="grid2">
        ${inp('sd', '사거리 SD (m)', d.sd)}${inp('ht', '프리즘고 HT (m)', d.ht)}
        ${inp('ha', `수평각 HA (${unit})`, d.ha)}${inp('va', `${vl} (${unit})`, d.va)}</div>`;
  el.innerHTML = `<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-label="관측점 입력">
    <h2>${sh.station} · ${sh.isNew ? '점 추가' : '점 수정'}</h2>
    <div class="seg" role="group">
      <button data-act="mode" data-mode="polar" aria-pressed="${d.mode === 'polar'}">관측값</button>
      <button data-act="mode" data-mode="coord" aria-pressed="${d.mode === 'coord'}">좌표</button>
    </div>
    <label class="field"><span>점명</span><input data-draft="name" list="names" autocomplete="off" autocapitalize="characters" value="${esc(d.name)}"></label>
    <datalist id="names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    ${fields}
    <div class="preview" id="preview"></div>
    <div class="row">
      <button class="primary grow" data-act="save-next">저장 후 다음 점</button>
      <button class="grow" data-act="save">저장</button>
    </div>
    <div class="row" style="margin-top:8px">
      ${sh.isNew ? '' : '<button class="danger grow" data-act="remove">삭제</button>'}
      <button class="grow" data-act="close">취소</button>
    </div></div></div>`;
  updatePreview();
}

function inp(k, label, v) {
  return `<label class="field"><span>${label}</span><input inputmode="decimal" data-draft="${k}" value="${esc(v)}"></label>`;
}

function updatePreview() {
  const el = document.getElementById('preview');
  if (!el || !state.sheet || state.sheet.type !== 'obs') return;
  const job = currentJob();
  const p = localPoint(state.sheet.draft, job.stations[state.sheet.station], job.settings);
  el.innerHTML = p.ok
    ? `기계점 기준 x ${f3(p.x)} · y ${f3(p.y)} · z ${f3(p.z)} · 수평거리 ${f3(Math.hypot(p.x, p.y))}`
    : `<span class="err">${esc(p.error)}</span>`;
}

function saveDraft() {
  const sh = state.sheet;
  const st = currentJob().stations[sh.station];
  const i = st.obs.findIndex(o => o.id === sh.draft.id);
  if (i >= 0) st.obs[i] = { ...sh.draft }; else st.obs.push({ ...sh.draft });
  persist();
}

function focusName() {
  const n = document.querySelector('[data-draft="name"]');
  if (n) n.focus();
}

// ---------- 이벤트 ----------

function resultText(job) {
  const r = solve(job);
  const lines = [`${job.name} (${today()})`];
  if (r.baseline) {
    lines.push(`S1–S2 수평거리 ${f3(r.baseline.hd)} m`, `사거리 ${f3(r.baseline.sd)} m`, `고저차 ${f3(r.baseline.dz)} m`,
      `잔차 RMS 수평 ${mmf(r.rmsH)} mm / 수직 ${mmf(r.rmsV)} mm (공통점 ${r.common.filter(c => !c.excluded).length}점)`);
  }
  for (const m of r.messages) lines.push(`※ ${m.text}`);
  if (r.points.length) {
    lines.push('', '점명\tX\tY\tZ');
    for (const p of r.points) lines.push(`${p.name}\t${f3(p.X)}\t${f3(p.Y)}\t${f3(p.Z)}`);
  }
  return lines.join('\n');
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const job = currentJob();
  if (act === 'close-bg') { if (e.target === t) { state.sheet = null; renderSheet(); } return; }
  switch (act) {
    case 'new': {
      const name = prompt('작업 이름', `기선 ${today()}`);
      if (name == null) return;
      const j = newJob(name.trim() || `기선 ${today()}`);
      state.jobs.push(j); state.currentId = j.id; state.tab = 'S1';
      persist(); render(); break;
    }
    case 'open': state.currentId = t.dataset.id; state.tab = 'S1'; render(); break;
    case 'home': state.currentId = null; render(); break;
    case 'rename': {
      const j = state.jobs.find(x => x.id === t.dataset.id);
      const name = prompt('작업 이름', j.name);
      if (name == null || !name.trim()) return;
      j.name = name.trim(); persist(); render(); break;
    }
    case 'delete': {
      const j = state.jobs.find(x => x.id === t.dataset.id);
      if (!confirm(`"${j.name}" 작업을 삭제할까요? 되돌릴 수 없습니다.`)) return;
      state.jobs = state.jobs.filter(x => x !== j); persist(); render(); break;
    }
    case 'backup': download(`기선거리-백업-${today()}.json`, exportBackup(state.jobs), 'application/json'); break;
    case 'tab': state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'add':
      state.sheet = { type: 'obs', station: t.dataset.st, draft: newObs(t.dataset.mode), isNew: true };
      renderSheet(); focusName(); break;
    case 'edit': {
      const o = job.stations[t.dataset.st].obs.find(x => x.id === t.dataset.id);
      state.sheet = { type: 'obs', station: t.dataset.st, draft: { ...o }, isNew: false };
      renderSheet(); break;
    }
    case 'mode': state.sheet.draft.mode = t.dataset.mode; renderSheet(); break;
    case 'save': saveDraft(); state.sheet = null; render(); break;
    case 'save-next': {
      saveDraft();
      const { station, draft } = state.sheet;
      state.sheet = { type: 'obs', station, draft: { ...newObs(draft.mode), ht: draft.ht }, isNew: true };
      render(); focusName(); break;
    }
    case 'remove': {
      if (!confirm('이 점을 삭제할까요?')) return;
      const st = job.stations[state.sheet.station];
      st.obs = st.obs.filter(o => o.id !== state.sheet.draft.id);
      state.sheet = null; persist(); render(); break;
    }
    case 'close': state.sheet = null; renderSheet(); break;
    case 'toggle': {
      const k = normName(t.dataset.name);
      const ex = new Set(job.excluded.map(normName));
      if (ex.has(k)) ex.delete(k); else ex.add(k);
      job.excluded = [...ex]; persist(); render(); break;
    }
    case 'csv': download(`${job.name}-${today()}.csv`, resultCsv(job, solve(job)), 'text/csv;charset=utf-8'); break;
    case 'copy': {
      const text = resultText(job);
      try { await navigator.clipboard.writeText(text); alert('결과를 복사했습니다.'); }
      catch { state.sheet = { type: 'copy', text }; renderSheet(); }
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  const job = currentJob();
  if (t.dataset.draft && state.sheet) {
    state.sheet.draft[t.dataset.draft] = t.value; updatePreview();
  } else if (t.dataset.bind && job) {
    job.stations[t.dataset.st][t.dataset.bind] = t.value; persist();
  } else if (t.dataset.set && job && (t.dataset.set === 'tolH' || t.dataset.set === 'tolV')) {
    const v = Number(t.value.replace(',', '.'));
    if (Number.isFinite(v) && v > 0) { job.settings[t.dataset.set] = v / 1000; persist(); }
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  const job = currentJob();
  if (t.dataset.set && job && t.tagName === 'SELECT') {
    job.settings[t.dataset.set] = t.value; persist(); render();
  } else if (t.dataset.act === 'restore' && t.files[0]) {
    const res = importBackup(await t.files[0].text());
    if (!res.ok) { alert(res.error); return; }
    const ids = new Set(state.jobs.map(j => j.id));
    const added = res.jobs.filter(j => !ids.has(j.id));
    if (!confirm(`백업에서 작업 ${res.jobs.length}개 중 새 작업 ${added.length}개를 추가할까요? (같은 작업은 건너뜀)`)) return;
    state.jobs.push(...added); persist(); render();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderSheet(); }
});

render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
</body>
</html>
